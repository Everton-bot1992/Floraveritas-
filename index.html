<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLORAVERITAS</title>
<meta name="description" content="A verdade científica por trás de cada planta.">
<meta name="theme-color" content="#1f4d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--verde:#1f4d2e;--limao:#b8e04a;--branco:#ffffff;--texto:#1b2a20;--fundo:#f4f8f2;--aviso:#fff4d6;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--verde:#2f6b43;--limao:#c9ef5e;--branco:#18301f;--texto:#eef5ea;--fundo:#0f1f15;--aviso:#3a3115;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);min-height:100vh}
header{background:var(--verde);color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.topo{display:flex;align-items:center;gap:12px}
.topo img{width:56px;height:56px;border-radius:12px}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{padding:20px;max-width:560px;margin:0 auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:var(--verde);color:#fff;font-size:16px;font-weight:600;margin-bottom:12px;cursor:pointer}
.btn.sec{background:transparent;color:var(--texto);border:2px solid var(--verde)}
.btn:disabled{opacity:.5;cursor:default}
input[type=file]{display:none}
#preview{width:100%;border-radius:12px;max-height:360px;object-fit:cover;display:none;margin-bottom:12px}
select,input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--verde);background:var(--branco);color:var(--texto);font-size:15px;margin-bottom:12px}
.card{background:var(--branco);border-radius:12px;padding:16px;margin-bottom:12px}
.aviso{background:var(--aviso);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.barra{height:8px;background:rgba(127,127,127,.3);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.barra div{height:100%;background:var(--limao)}
.sci{font-style:italic}
.muted{font-size:13px;opacity:.75}
label{font-size:14px;display:block;margin-bottom:4px}
details{margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="topo">
    <img src="icon.svg" alt="Logo FLORAVERITAS">
    <div>
      <h1>FLORAVERITAS</h1>
      <p>A verdade científica por trás de cada planta.</p>
    </div>
  </div>
</header>
<main>
  <details id="cfg">
    <summary>Configurar chave da API Pl@ntNet</summary>
    <label for="chave">Chave de API (obtida gratuitamente em my.plantnet.org)</label>
    <input id="chave" type="text" autocomplete="off" placeholder="Cole sua chave aqui">
    <button class="btn sec" id="salvarChave">Salvar chave neste aparelho</button>
  </details>

  <label for="parte">Parte da planta que aparece na foto</label>
  <select id="parte">
    <option value="flower">Flor</option>
    <option value="leaf" selected>Folha</option>
    <option value="fruit">Fruto</option>
    <option value="bark">Caule ou casca</option>
    <option value="habit">Planta inteira</option>
    <option value="other">Outra</option>
  </select>

  <p class="muted">Dica: fotografe a parte da planta de perto e com boa luz.</p>
  <img id="preview" alt="Foto selecionada">
  <input id="cam" type="file" accept="image/*" capture="environment">
  <input id="gal" type="file" accept="image/*">
  <button class="btn" id="btnCam">Tirar foto</button>
  <button class="btn sec" id="btnGal">Escolher da galeria</button>
  <button class="btn" id="btnId" disabled>Identificar</button>
  <div id="status" class="muted" role="status"></div>
  <div id="result"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const CHAVE_KEY = 'floraveritas_plantnet_key';
let foto = null;
let urlAnterior = null; 
  // Chave guardada só neste aparelho (localStorage), nunca enviada para outro lugar além da Pl@ntNet.
$('chave').value = localStorage.getItem(CHAVE_KEY) || '';
if (!$('chave').value) $('cfg').open = true;
$('salvarChave').onclick = () => {
  const v = $('chave').value.trim();
  if (!v) { $('status').textContent = 'Digite a chave antes de salvar.'; return; }
  localStorage.setItem(CHAVE_KEY, v);
  $('cfg').open = false;
  $('status').textContent = 'Chave salva neste aparelho.';
};

// Reduz a foto para no máximo 1024 px, economizando memória e dados.
async function reduzir(file) {
  const MAX = 1024;
  let bmp;
  try {
    bmp = await createImageBitmap(file);
  } catch (e) {
    return null;
  }
  const escala = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * escala));
  const h = Math.max(1, Math.round(bmp.height * escala));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close();
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
  canvas.width = 0;
  canvas.height = 0;
  return blob;
}

async function selecionar(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  $('status').textContent = 'Preparando a foto...';
  $('btnId').disabled = true;
  const pequena = await reduzir(f);
  if (!pequena) {
    $('status').textContent = 'Este formato de foto não pode ser lido pelo navegador. Ajuste a câmera para JPEG e tire a foto de novo.';
    return;
  }
  if (urlAnterior) URL.revokeObjectURL(urlAnterior);
  urlAnterior = URL.createObjectURL(pequena);
  foto = pequena;
  $('preview').src = urlAnterior;
  $('preview').style.display = 'block';
  $('btnId').disabled = false;
  $('result').textContent = '';
  $('status').textContent = 'Foto pronta. Toque em Identificar.';
}

$('btnCam').onclick = () => $('cam').click();
$('btnGal').onclick = () => $('gal').click();
$('cam').onchange = () => selecionar($('cam'));
$('gal').onchange = () => selecionar($('gal'));
  function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function mostrar(data) {
  const r = $('result');
  r.textContent = '';
  r.appendChild(el('div', 'aviso',
    'Sugestão automática (Pl@ntNet), não uma identificação confirmada. Confira o nome em Plants of the World Online (Kew) ou no GBIF antes de usar a informação.'));
  const res = Array.isArray(data.results) ? data.results.slice(0, 3) : [];
  if (!res.length) {
    r.appendChild(el('div', 'card', 'Não foi possível identificar com segurança. Tente fotografar folhas, flores ou frutos de perto.'));
    return;
  }
  res.forEach((item, i) => {
    const sp = item.species || {};
    const score = Math.round((Number(item.score) || 0) * 100);
    const card = el('div', 'card');
    const nomes = Array.isArray(sp.commonNames) && sp.commonNames.length ? sp.commonNames.join(', ') : 'Nome popular não informado';
    card.appendChild(el('strong', '', (i + 1) + '. ' + nomes));
    card.appendChild(el('div', 'sci', sp.scientificNameWithoutAuthor || 'Nome científico não informado'));
    if (sp.family && sp.family.scientificNameWithoutAuthor) {
      card.appendChild(el('div', 'muted', 'Família: ' + sp.family.scientificNameWithoutAuthor));
    }
    card.appendChild(el('div', 'muted', 'Confiança estimada: ' + score + '%'));
    const barra = el('div', 'barra');
    const fill = el('div');
    fill.style.width = Math.min(100, score) + '%';
    barra.appendChild(fill);
    card.appendChild(barra);
    r.appendChild(card);
  });
}
  $('btnId').onclick = async () => {
  if (!foto) return;
  const chave = localStorage.getItem(CHAVE_KEY);
  if (!chave) {
    $('status').textContent = 'Configure primeiro a chave da API Pl@ntNet.';
    $('cfg').open = true;
    return;
  }
  const btn = $('btnId');
  btn.disabled = true;
  $('status').textContent = 'Identificando...';
  $('result').textContent = '';
  try {
    const form = new FormData();
    form.append('images', foto, 'planta.jpg');
    form.append('organs', $('parte').value);
    const resp = await fetch('https://my-api.plantnet.org/v2/identify/all?lang=pt&api-key=' + encodeURIComponent(chave), {
      method: 'POST',
      body: form
    });
    if (resp.status === 401 || resp.status === 403) {
      throw new Error('Chave inválida ou sem permissão. Verifique a chave na configuração.');
    }
    if (resp.status === 429) {
      throw new Error('Limite diário de identificações atingido. Tente novamente mais tarde.');
    }
    if (!resp.ok) {
      throw new Error('Serviço indisponível no momento (código ' + resp.status + ').');
    }
    const data = await resp.json();
    $('status').textContent = '';
    mostrar(data);
  } catch (e) {
    $('status').textContent = '';
    $('result').appendChild(el('div', 'aviso', (e && e.message) ? e.message : 'Não foi possível identificar agora. Verifique sua conexão.'));
  } finally {
    btn.disabled = false;
  }
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
